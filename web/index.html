<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ExcelVoca</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="connect-overlay" class="overlay hidden">
    <div class="connect-box">
      <h1>ExcelVoca</h1>
      <div id="token-setup-fields">
        <p>GitHub 개인용 접근 토큰을 한 번만 입력하면, 그다음부턴 PIN으로 간편하게 열 수 있어요.</p>
        <input id="token-input" type="password" placeholder="ghp_..." autocomplete="off" />
        <input id="pin-setup-input" type="text" inputmode="numeric" maxlength="4" placeholder="PIN 4자리" value="0000" />
      </div>
      <div id="pin-unlock-fields" class="hidden">
        <p>PIN을 입력하세요.</p>
        <input id="pin-unlock-input" type="text" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off" />
      </div>
      <button id="connect-btn">연결</button>
      <p id="connect-status" class="connect-status"></p>
    </div>
  </div>

  <div id="resume-dialog-overlay" class="overlay hidden"></div>

  <div id="manage-overlay" class="overlay hidden">
    <div class="dialog-box">
      <div class="dialog-title">기록 관리</div>
      <div class="dialog-body">
        <p>오늘 통계만 지우거나, 전체 학습 기록을 초기화할 수 있어요.</p>
      </div>
      <div class="dialog-actions manage-actions">
        <button id="reset-today-btn" class="dialog-btn">오늘 기록 초기화</button>
        <button id="reset-all-btn" class="dialog-btn danger">전체 기록 초기화</button>
        <button id="manage-close-btn" class="dialog-btn primary">닫기</button>
      </div>
    </div>
  </div>

  <main id="app">
    <button id="mode-toggle-btn" class="mode-toggle">📖 예문 모드</button>
    <div id="word-display" class="word-display"></div>
    <div id="quiz-panel" class="panel"></div>
    <div id="stats-panel" class="panel"></div>
    <button id="manage-btn" class="manage-trigger">기록 관리</button>
  </main>

  <script type="module" src="./webApp.js"></script>
</body>
</html>
